name: Sync Substack posts

on:
  schedule:
    # Daily at 13:00 UTC (~8am Todd's time, DST-dependent). Adjust as needed.
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Substack feed and update posts.json
        run: npm run sync-substack

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- src/data/substack-posts.json; then
            echo "No new posts, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/substack-posts.json
          git commit -m "chore: sync Substack posts"
          git push
